  # ---- FACT TABLES ----

  - name: fct_bookings
    description: "Fact table for bookings. Central fact table containing all booking transactions with denormalized context from leads, orders, properties, and agencies. Grain: one row per booking (lead-order pair)."
    columns:
      - name: lead_id
        description: "Lead identifier (part of composite key)"
        tests:
          - not_null
      - name: order_id
        description: "Order identifier (part of composite key, may be null for unconverted leads)"
        tests: []
      - name: property_id
        description: "Foreign key to dim_properties"
        tests:
          - not_null
      - name: agency_id
        description: "Foreign key to dim_agencies"
        tests:
          - not_null
      - name: external_booking_id
        description: "External booking reference"
      - name: thread_id
        description: "Foreign key to dim_threads (may be null if no communication)"
      - name: internal_property_name
        description: "Denormalized property name"
      - name: property_type
        description: "Denormalized property type"
      - name: property_city
        description: "Property city location"
      - name: agency_name
        description: "Denormalized agency name"
      - name: base_currency
        description: "Agency's base currency"
      - name: lead_type
        description: "Type of lead"
      - name: lead_current_status
        description: "Current status in sales funnel"
      - name: lead_source
        description: "Source of the booking inquiry"
      - name: guest_id
        description: "Unique guest identifier"
      - name: guest_first_name
        description: "Guest first name (titlecased)"
      - name: guest_last_name
        description: "Guest last name (titlecased)"
      - name: guest_email
        description: "Guest email address"
      - name: guest_phone_number
        description: "Guest phone number"
      - name: total_guests_count
        description: "Total number of guests (adults + children + infants)"
      - name: check_in_date
        description: "Check-in date"
      - name: check_out_date
        description: "Check-out date"
      - name: total_nights
        description: "Length of stay in nights"
      - name: lead_time_days
        description: "Days between booking and check-in"
      - name: gross_revenue
        description: "Total gross revenue from booking"
      - name: rent_gross_amount
        description: "Gross accommodation charges before commission"
      - name: rent_net_amount
        description: "Net accommodation charges after commission"
      - name: total_fees_amount
        description: "Total of all fees"
      - name: total_cleaning_fee
        description: "Cleaning fee charged"
      - name: total_service_fee
        description: "Service fee charged"
      - name: total_pet_fee
        description: "Pet fee charged"
      - name: total_management_fee
        description: "Management fee charged"
      - name: total_other_fees
        description: "Other miscellaneous fees"
      - name: total_taxes_amount
        description: "Total taxes on the booking"
      - name: average_daily_rate_per_stay
        description: "Average daily rate calculated for this stay"
      - name: channel_commission_paid
        description: "Commission paid to OTA channel"
      - name: booked_at_utc
        description: "When the booking was made"
      - name: lead_created_at_utc
        description: "When the lead was created"
      - name: lead_last_updated_at_utc
        description: "When the lead was last updated"
      - name: order_created_at_utc
        description: "When the order was created"
      - name: order_updated_at_utc
        description: "When the order was last updated"

  - name: fct_order_transactions
    description: "Fact table for financial transactions. Aggregated transaction summaries per order showing totals, payments, refunds, and transaction timelines. Grain: one row per order."
    columns:
      - name: order_id
        description: "Unique order identifier (PK)"
        tests:
          - unique
          - not_null
      - name: total_paid_amount
        description: "Total amount paid by guest (SALE transactions)"
        tests:
          - not_null
      - name: total_refunded_amount
        description: "Total amount refunded to guest"
      - name: net_transaction_amount
        description: "Net revenue (Payments - Refunds)"
        tests:
          - not_null
      - name: first_payment_at
        description: "Timestamp of first successful payment"
      - name: last_transaction_at
        description: "Timestamp of last successful transaction"
      - name: transaction_count
        description: "Number of successful transactions for this order"
        tests:
          - not_null
      - name: has_manual_transaction
        description: "Whether any transactions were manually created"

  - name: fct_pricing
    description: "Fact table for pricing and revenue metrics. Aggregated financial data per property and time period. Grain: one row per property per day."
    columns:
      - name: property_id
        description: "Foreign key to dim_properties"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_properties')
                field: property_id
      - name: calendar_date
        description: "Date for this pricing record"
        tests:
          - not_null
      - name: price_amount
        description: "Price per night for this date"
      - name: is_unavailable
        description: "Whether date is blocked/unavailable"
      - name: min_stay_length
        description: "Minimum stay requirement"
      - name: max_stay_length
        description: "Maximum stay allowed"
      - name: total_bookings_revenue
        description: "Total revenue from bookings on this date"
      - name: booking_count
        description: "Number of check-ins on this date"
