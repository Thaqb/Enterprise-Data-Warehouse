[project]
name = "ingestion-layer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb]>=1.20.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "enrichment",
    "hostfully_pipeline",
]
