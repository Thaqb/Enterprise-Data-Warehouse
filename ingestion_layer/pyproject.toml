[project]
name = "ingestion-layer"
version = "0.1.0"
description = "Ingestion layer using dlt to ingest data from the Hostfully API"
readme = "docs/DOCUMENTATION.md"
authors = [
    { name = "MahmoudMostafa01", email = "mahmoudmostafaworks@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb]>=1.20.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "hostfully"